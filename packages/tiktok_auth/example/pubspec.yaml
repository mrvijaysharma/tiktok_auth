name: tiktok_auth_example
description: Demonstrates how to sign in with TikTok using the tiktok_auth plugin.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  tiktok_auth: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

# Read by `dart run tiktok_auth:doctor`. Keep in sync with
# lib/tiktok_config.dart.
tiktok_auth:
  client_key: YOUR_TIKTOK_CLIENT_KEY
  redirect_uri: https://example.com/tiktok/callback
