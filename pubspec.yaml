name: tiktok_auth_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/tiktok_auth
  - packages/tiktok_auth/example
  - packages/tiktok_auth_platform_interface
  - packages/tiktok_auth_android
  - packages/tiktok_auth_ios
  - packages/tiktok_auth_server

dev_dependencies:
  melos: ^8.7.0

melos:
  scripts:
    analyze:
      description: Analyze every package with strict lints.
      exec: dart analyze --fatal-infos .

    format:
      description: Fail if any Dart file is not formatted.
      exec: dart format --output=none --set-exit-if-changed .

    test:flutter:
      description: Run unit tests in Flutter packages.
      exec: flutter test --coverage
      packageFilters:
        flutter: true
        dirExists: test

    test:dart:
      description: Run unit tests in pure Dart packages.
      exec: dart test
      packageFilters:
        flutter: false
        dirExists: test

    pigeon:
      description: Regenerate the Pigeon bindings of the Android and iOS packages.
      # Pigeon lives in tool/pigeon, outside the workspace, so the packages
      # still resolve on the minimum Flutter version. Its Dart output is then
      # formatted like the rest of the code.
      run: cd tool/pigeon && dart pub get && dart run pigeon --input android.dart && dart run pigeon --input ios.dart && cd ../.. && dart format packages/tiktok_auth_android/lib/src/messages.g.dart packages/tiktok_auth_ios/lib/src/messages.g.dart
